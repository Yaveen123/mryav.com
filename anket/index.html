<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anket</title>
  <meta name="description" content="Count down to what matters every time you open a tab. Add your calendars, pick the events you care about, and set your own background — all stored on your own device. Free on the Chrome Web Store.">
  <link rel="canonical" href="https://mryav.com/anket">
  <link rel="icon" href="/assets/favicon.png">
  <meta name="theme-color" content="#ffffff">

  <!-- Link embeds. og:image must be an absolute URL — scrapers do not resolve
       relative paths. The file is 1.88:1, near the 1.91:1 that Facebook,
       LinkedIn, Slack and Discord lay out against, so it is shown whole
       rather than centre-cropped. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Anket">
  <meta property="og:url" content="https://mryav.com/anket">
  <meta property="og:title" content="Anket — The freshest version of your new tab page">
  <meta property="og:description" content="Count down to what matters every time you open a tab. Add your calendars, pick the events you care about, and set your own background — all stored on your own device. Free on the Chrome Web Store.">
  <meta property="og:locale" content="en_US">
  <meta property="og:image" content="https://mryav.com/assets/anket-og.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="680">
  <meta property="og:image:alt" content="The Anket new tab page on a laptop: a soft illustrated meadow background with a sleeping rabbit, and a list of upcoming events counting down the days left.">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Anket — The freshest version of your new tab page">
  <meta name="twitter:description" content="Count down to what matters every time you open a tab. Add your calendars, pick the events you care about, and set your own background — all stored on your own device. Free on the Chrome Web Store.">
  <meta name="twitter:image" content="https://mryav.com/assets/anket-og.png">
  <meta name="twitter:image:alt" content="The Anket new tab page on a laptop: a soft illustrated meadow background with a sleeping rabbit, and a list of upcoming events counting down the days left.">

  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <main class="anket">
    <div class="anket-row">
      <div class="anket-copy">
        <h1 class="wordmark">Anket</h1>
        <p class="lede">The freshest version of your new tab page.</p>
        <p class="get-it">Get it on&hellip;</p>

        <!-- Edge and Firefox listings are still in review. They are plain spans,
             not links, so they take no keyboard focus while they lead nowhere;
             swap each back to <a class="store-link store-link--edge" href="..">
             and drop the "Coming soon!" span once it is live. -->
        <div class="store-links">
          <a class="store-link store-link--chrome"
             href="https://chromewebstore.google.com/detail/anket-new-tab-page/adbampbngjnjicfbfmbdljjdjkondbik?authuser=0&amp;hl=en"
             target="_blank" rel="noopener">
            <span class="icon icon--chrome"><img src="/assets/chrome.png" alt="" width="24" height="20"></span>
            <span>Chrome Web Store</span>
          </a>
          <span class="store-link store-link--soon">
            <span class="icon icon--edge"><img src="/assets/edge.png" alt="" width="22" height="20"></span>
            <span>Edge Add-ons</span>
            <span class="soon">Coming soon!</span>
          </span>
          <span class="store-link store-link--soon">
            <span class="icon icon--firefox"><img src="/assets/firefox.png" alt="" width="18" height="18"></span>
            <span>Add-ons for Firefox</span>
            <span class="soon">Coming soon!</span>
          </span>
        </div>

        <p class="privacy-link"><a href="/anket/privacy-policy">Privacy Policy</a></p>
      </div>

      <div class="anket-shot">
        <img src="/assets/anket-hero.png" alt="Anket new tab page showing a calendar countdown over a custom background" width="494" height="444">
      </div>
    </div>
  </main>

  <p class="signoff">
    <a class="signoff-link" href="https://www.linkedin.com/in/yav1/" target="_blank" rel="noopener">
      <span class="signoff-text">Love,</span>
      <img class="signature" src="/assets/yav-signature.svg" alt="Yav" width="30" height="22">
      <span class="visually-hidden"> on LinkedIn</span>
    </a>
  </p>
</body>
</html>
