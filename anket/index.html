<!doctype html>

  <link rel="icon" href="/assets/favicon.png">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <main class="anket">
    <div class="anket-row">
      <div class="anket-copy">
        <h1 class="wordmark">Anket</h1>

          </a>
          <a class="store-link store-link--edge" href="/404.html">

        <p class="privacy-link"><a href="/anket/privacy-policy">Privacy Policy</a></p>
      </div>

      <div class="anket-shot">
        <img src="/assets/anket-hero.png" alt="Anket new tab page showing a calendar countdown over a custom background" width="412" height="370">

  <p class="signoff">
